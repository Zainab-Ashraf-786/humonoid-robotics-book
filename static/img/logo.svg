<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot head -->
  <rect x="30" y="20" width="40" height="40" rx="5" fill="#6366f1"/>
  
  <!-- Eyes -->
  <circle cx="40" cy="35" r="3" fill="white"/>
  <circle cx="60" cy="35" r="3" fill="white"/>
  
  <!-- Mouth -->
  <rect x="45" y="45" width="10" height="3" rx="1" fill="white"/>
  
  <!-- Body -->
  <rect x="35" y="60" width="30" height="25" rx="3" fill="#8b5cf6"/>
  
  <!-- Arms -->
  <rect x="20" y="65" width="15" height="5" rx="2" fill="#8b5cf6"/>
  <rect x="65" y="65" width="15" height="5" rx="2" fill="#8b5cf6"/>
  
  <!-- Legs -->
  <rect x="40" y="85" width="5" height="10" fill="#8b5cf6"/>
  <rect x="55" y="85" width="5" height="10" fill="#8b5cf6"/>
</svg>